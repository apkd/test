---
name: Build, test and release

"on":
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  checks: write
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build-ipa:
    name: build IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show tool versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos -show-sdk-path
          brew --version

      - name: Compute Swift cache key
        id: swift-cache-key
        shell: bash
        run: |
          set -euo pipefail

          echo "swift_version=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "xcode_version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "target_triple=arm64-apple-ios" >> "$GITHUB_OUTPUT"
          echo "build_config=release-ipa" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build data
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
            Package.resolved
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-${{ steps.swift-cache-key.outputs.build_config }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-${{ steps.swift-cache-key.outputs.build_config }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build unsigned IPA
        run: xtool dev build --configuration release --ipa

      - name: Prepare IPA artifact
        shell: bash
        run: |
          set -euo pipefail

          ipa="$(
            find xtool -type f -name '*.ipa' |
            sort |
            head -n 1
          )"

          if [[ -z "$ipa" ]]; then
            echo "xtool did not produce an IPA." >&2
            find xtool -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release"
          cp "$ipa" "$RUNNER_TEMP/release/TestApp.ipa"
          ls -lh "$RUNNER_TEMP/release/TestApp.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-ipa
          path: ${{ runner.temp }}/release/TestApp.ipa
          if-no-files-found: error

  package-tests:
    name: package tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show tool versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun -sdk iphonesimulator -show-sdk-path
          xcrun simctl list runtimes

      - name: Compute Swift cache key
        id: swift-cache-key
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64)
              triple="arm64-apple-ios-simulator"
              ;;
            x86_64)
              triple="x86_64-apple-ios-simulator"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          echo "swift_version=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "xcode_version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "target_triple=$triple" >> "$GITHUB_OUTPUT"
          echo "build_config=debug-tests" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            .build
            .derived-data/package-tests
            ~/.swiftpm
            Package.resolved
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-${{ steps.swift-cache-key.outputs.build_config }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-${{ steps.swift-cache-key.outputs.build_config }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Select package scheme and simulator
        id: settings
        shell: bash
        run: |
          set -euo pipefail

          schemes_json="$(xcodebuild -list -json)"
          printf '%s\n' "$schemes_json"

          scheme="$(
            printf '%s' "$schemes_json" |
              jq -r '
                (.project.schemes // .workspace.schemes // []) as $schemes
                | (
                    $schemes
                    | map(select(. == "TestApp-Package" or . == "TestApp"))
                    | .[0]
                  )
                  // $schemes[0]
                  // empty
              '
          )"

          if [[ -z "$scheme" ]]; then
            echo "No xcodebuild scheme found." >&2
            exit 1
          fi

          xcrun simctl list devices available

          simulator_id="$(
            xcrun simctl list devices available -j |
              jq -r '
                [
                  .devices
                  | to_entries[]
                  | .value[]
                  | select(
                      .isAvailable == true
                      and (.name | startswith("iPhone"))
                    )
                ] as $devices
                | (
                    ($devices | map(select(.name == "iPhone 13 mini")) | .[0])
                    // ($devices | map(select(.name == "iPhone 12 mini")) | .[0])
                    // ($devices | map(select(.name | test("^iPhone SE"))) | .[0])
                    // ($devices | map(select(.name | test("^iPhone 16"))) | .[0])
                    // (
                      $devices
                      | map(select(.name | test("^iPhone 15")))
                      | .[0]
                    )
                    // $devices[0]
                    // {}
                  )
                | .udid // empty
              '
          )"

          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi

          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "simulator_id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        run: |
          simulator_id="${{ steps.settings.outputs.simulator_id }}"
          destination="platform=iOS Simulator,id=${simulator_id}"

          xcodebuild test \
            -derivedDataPath .derived-data/package-tests \
            -enableCodeCoverage NO \
            -scheme "${{ steps.settings.outputs.scheme }}" \
            -destination "$destination" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            INDEX_ENABLE=NO \
            ENABLE_PREVIEWS=NO

      - name: Publish test report
        if: success() || failure()
        uses: lunij/xcresult@v1
        with:
          path: TestResults.xcresult
          title: Package test results
          show-passed-tests: false
          show-code-coverage: false
          upload: never

  app-launch-smoke:
    name: app launch smoke
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show tool versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun -sdk iphonesimulator -show-sdk-path
          xcrun simctl list runtimes
          uname -m

      - name: Compute Swift cache key
        id: swift-cache-key
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64)
              triple="arm64-apple-ios-simulator"
              ;;
            x86_64)
              triple="x86_64-apple-ios-simulator"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          echo "swift_version=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "xcode_version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "target_triple=$triple" >> "$GITHUB_OUTPUT"
          echo "build_config=debug-smoke" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build data
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
            Package.resolved
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-${{ steps.swift-cache-key.outputs.build_config }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-${{ steps.swift-cache-key.outputs.build_config }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-${{ steps.swift-cache-key.outputs.target_triple }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-key.outputs.xcode_version }}-${{ steps.swift-cache-key.outputs.swift_version }}-

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Select and start simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list devices available

          simulator_id="$(
            xcrun simctl list devices available -j |
              jq -r '
                [
                  .devices
                  | to_entries[]
                  | .value[]
                  | select(
                      .isAvailable == true
                      and (.name | startswith("iPhone"))
                    )
                ] as $devices
                | (
                    ($devices | map(select(.name == "iPhone 13 mini")) | .[0])
                    // ($devices | map(select(.name == "iPhone 12 mini")) | .[0])
                    // ($devices | map(select(.name | test("^iPhone SE"))) | .[0])
                    // ($devices | map(select(.name | test("^iPhone 16"))) | .[0])
                    // (
                      $devices
                      | map(select(.name | test("^iPhone 15")))
                      | .[0]
                    )
                    // $devices[0]
                    // {}
                  )
                | .udid // empty
              '
          )"

          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi

          echo "simulator_id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id" || true

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail

          xtool dev build --configuration debug --triple "${{ steps.swift-cache-key.outputs.target_triple }}"

      - name: Install simulator app
        shell: bash
        run: |
          set -euo pipefail

          simulator_id="${{ steps.simulator.outputs.simulator_id }}"
          bundle_id="dev.tryfinally.test-app"

          app="$(
            find xtool -maxdepth 2 -type d -name '*.app' |
            sort |
            head -n 1
          )"

          if [[ -z "$app" ]]; then
            echo "xtool did not produce a simulator .app." >&2
            find xtool -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi

          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" "$app"
          xcrun simctl get_app_container "$simulator_id" "$bundle_id"

      - name: Capture app screen report
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail

          simulator_id="${{ steps.simulator.outputs.simulator_id }}"
          bundle_id="dev.tryfinally.test-app"
          screenshots_dir="app-smoke-screenshots"
          logs_dir="$RUNNER_TEMP/app-smoke-logs"
          results="$RUNNER_TEMP/app-smoke-results.tsv"
          initial_delay_seconds="0.8"
          transition_delay_seconds="0.24"
          smoke_file_name="meditation-smoke-panel.txt"

          rm -rf "$screenshots_dir"
          mkdir -p "$screenshots_dir"
          mkdir -p "$logs_dir"
          : > "$results"

          write_result() {
            printf '%s\t%s\n' "$1" "$2" >> "$results"
          }

          capture_screenshot() {
            local file="$1"

            for attempt in 1 2 3; do
              if xcrun simctl io "$simulator_id" screenshot "$file"; then
                return 0
              fi

              sleep 0.5
            done

            return 1
          }

          capture_current_mode() {
            local file_name="$1"
            local title="$2"
            local file="$screenshots_dir/$file_name.png"
            local result="passed"

            if ! capture_screenshot "$file"; then
              result="failed"
            fi

            write_result "$title" "$result"

            if [[ "$result" != "passed" ]]; then
              return 1
            fi
          }

          set_mode_phase() {
            local mode="$1"
            local title="$2"
            local phase_name="$3"
            local cycle_progress="$4"

            printf '%s %.3f\n' "$mode" "$cycle_progress" > "$smoke_control_file"
            sleep "$transition_delay_seconds"
            capture_current_mode "$mode-$phase_name" "$title ($phase_name)"
          }

          capture_animation_panel() {
            local mode="$1"
            local title="$2"

            set_mode_phase "$mode" "$title" "inhale" "0.250"
            set_mode_phase "$mode" "$title" "full" "0.500"
            set_mode_phase "$mode" "$title" "exhale" "0.850"
          }

          overall=0
          app_container="$(xcrun simctl get_app_container "$simulator_id" "$bundle_id" data)"
          smoke_control_file="$app_container/Documents/$smoke_file_name"
          launch_log="$logs_dir/app-launch.txt"

          mkdir -p "$(dirname "$smoke_control_file")"
          printf '%s\n' "config" > "$smoke_control_file"

          if SIMCTL_CHILD_MEDITATION_SMOKE_CONTROL_FILE="1" \
            SIMCTL_CHILD_MEDITATION_ANIMATION_MODE="config" \
            xcrun simctl launch "$simulator_id" "$bundle_id" > "$launch_log" 2>&1; then
            sleep "$initial_delay_seconds"
            capture_current_mode "config" "Configuration" || overall=1
            capture_animation_panel "breathing-horizon" "Breathing horizon" || overall=1
            capture_animation_panel "silk-ribbon" "Silk ribbon" || overall=1
            capture_animation_panel "ink-bloom" "Ink bloom" || overall=1
            capture_animation_panel "soft-glow" "Soft glow" || overall=1
          else
            overall=1
            cat "$launch_log" >&2 || true
            write_result "Configuration" "failed"
            write_result "Breathing horizon (inhale)" "failed"
            write_result "Breathing horizon (full)" "failed"
            write_result "Breathing horizon (exhale)" "failed"
            write_result "Silk ribbon (inhale)" "failed"
            write_result "Silk ribbon (full)" "failed"
            write_result "Silk ribbon (exhale)" "failed"
            write_result "Ink bloom (inhale)" "failed"
            write_result "Ink bloom (full)" "failed"
            write_result "Ink bloom (exhale)" "failed"
            write_result "Soft glow (inhale)" "failed"
            write_result "Soft glow (full)" "failed"
            write_result "Soft glow (exhale)" "failed"
          fi

          xcrun simctl terminate "$simulator_id" "$bundle_id" || true

          {
            echo "# App launch smoke report"
            echo
            echo "The app is launched once, then each panel is selected through an env-gated smoke control file. Animation panels are captured at inhale, full-breath, and exhale cycle positions."
            echo
            echo "Screenshots are uploaded as flat PNG files in the \`app-smoke-screenshots\` artifact."
            echo

            while IFS=$'\t' read -r title result; do
              printf -- '- **%s**: %s\n' "$title" "$result"
            done < "$results"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$overall"

      - name: Upload app smoke screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-screenshots
          path: app-smoke-screenshots/*.png
          if-no-files-found: error

  release:
    name: update rolling release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs:
      - build-ipa
      - package-tests
      - app-launch-smoke
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: TestApp-ipa
          path: release-assets

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          notes="release-notes.md"
          repo_url="https://github.com/${{ github.repository }}"
          short_sha="${GITHUB_SHA::7}"

          {
            echo "This is a rolling prototype release. It is updated when the master CI pipeline passes."
            echo
            echo "Commit: [$short_sha]($repo_url/commit/$GITHUB_SHA)"
            echo
            echo "Included artifacts:"
            echo "- TestApp.ipa"
            echo
            echo "Latest changes:"
            echo
            git log -n 12 --pretty='- %s ([%h]('"$repo_url"'/commit/%H))'
          } > "$notes"

          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release target
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$GITHUB_REF_NAME" --quiet
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Remote branch '$GITHUB_REF_NAME' advanced from $GITHUB_SHA to $remote_sha; cancelling release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Release skipped"
              echo
              echo "The branch no longer points to the workflow commit."
              echo
              echo "- Ref: \`$GITHUB_REF_NAME\`"
              echo "- Workflow commit: \`$GITHUB_SHA\`"
              echo "- Current tip: \`$remote_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update rolling release
        if: steps.verify.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="release"
          title="Meditation prototype ($(date -u '+%d-%m-%Y'))"
          notes="release-notes.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$tag" "$GITHUB_SHA" -m "Latest rolling release"
          git push -f origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$tag" --title "$title" --notes-file "$notes" --target "$GITHUB_SHA" --latest
          fi

          for stale_asset in app-smoke-config.png app-smoke-breathing-horizon.png app-smoke-silk-ribbon.png app-smoke-ink-bloom.png app-smoke-soft-glow.png; do
            gh release delete-asset "$tag" "$stale_asset" -y >/dev/null 2>&1 || true
          done

          mapfile -t files < <(find release-assets -maxdepth 1 -type f | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          gh release upload "$tag" "${files[@]}" --clobber
